name: github-metadata-pipeline

on:
  workflow_dispatch: {}   # manual "Run workflow" button for now
  # schedule:
  #   - cron: "0 */6 * * *"   # uncomment later to auto-repeat every 6h

concurrency:
  group: github-metadata-pipeline
  cancel-in-progress: false   # never kill a run that's mid-flight

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # ~5h55m of work, leaves buffer before the 6h hard limit

    steps:
      - name: Checkout repo (script only, db is NOT in git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install aiohttp python-dotenv requests

      - name: Download latest db from release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python download_db_release.py --repo ${{ github.repository }} --file github_pipeline.db --tag db-snapshot

      - name: Show starting status
        run: python percent.py status

      - name: Run pipeline with periodic checkpoints
        env:
          GITHUB_TOKENS: ${{ secrets.GH_TOKENS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          END=$((SECONDS + 20400))   # ~5h40m total budget
          CHUNK=2400                # ~40 min per chunk before checkpointing

          while [ $SECONDS -lt $END ]; do
            REMAINING=$((END - SECONDS))
            THIS_CHUNK=$CHUNK
            if [ $REMAINING -lt $CHUNK ]; then
              THIS_CHUNK=$REMAINING
            fi
            if [ $THIS_CHUNK -le 0 ]; then
              break
            fi

            echo "=== Running chunk for ${THIS_CHUNK}s ==="
            timeout $THIS_CHUNK python percent.py run --min-files 2 --max-files 80
            RC=$?
            echo "=== Chunk exited with code $RC ==="

            echo "=== Checkpoint: uploading db ==="
            python upload_db_release.py --repo ${{ github.repository }} --file github_pipeline.db --tag db-snapshot
            python percent.py status

            # If the run finished on its own (no more pending rows), stop looping
            if [ $RC -eq 0 ]; then
              PENDING=$(python -c "
                import sqlite3
                c = sqlite3.connect('github_pipeline.db')
                row = c.execute(\"SELECT COUNT(*) FROM repo_ids WHERE status='pending'\").fetchone()
                print(row[0])
                ")
              if [ "$PENDING" = "0" ]; then
                echo "No pending rows left. Done."
                break
              fi
            fi
          done
