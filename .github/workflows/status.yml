name: SQLite Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # every hour

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install huggingface_hub

      - name: Download SQLite DB
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="PERDYPTO/db_snapshot",   # change this
              filename="github_pipeline.db",    # change if needed
              repo_type="dataset",
              token="${HF_TOKEN}",
              local_dir="."
          )
          PY

      - name: Run status
        run: |
          python scripts/github_pipeline_sqlite.py \
            --db github_pipeline.db status > status.txt

      - name: Extract summary
        run: |
          python <<'PY'
          import re

          text = open("status.txt").read()

          wanted = [
              "=== repo_ids ===",
              "=== metadata",
              "=== forks",
              "=== parquet ingestion",
              "Top python_pct:"
          ]

          printing = False
          for line in text.splitlines():
              if any(line.startswith(x) for x in wanted):
                  printing = True
              if printing:
                  print(line)
          PY

      - name: Upload full status
        uses: actions/upload-artifact@v4
        with:
          name: status
          path: status.txt
