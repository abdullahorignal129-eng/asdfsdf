name: Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download database
        run: |
          python <<'PY'
          import urllib.request

          urllib.request.urlretrieve(
              "https://huggingface.co/buckets/PERDYPTO/db_snapshot/resolve/github_pipeline.db?download=true",
              "github_pipeline.db"
          )
          PY

      - name: Print status
        run: |
          python rpercent.py --db github_pipeline.db status
